name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compilar binarios
        working-directory: conectar-gateway
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../Conectar-Gateway.exe .
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../conectar-gateway-linux .

      - name: Publicar en el Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Conectar-Gateway.exe
            conectar-gateway-linux
