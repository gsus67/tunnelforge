name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Instalar compilador cruzado de Windows
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Generar recurso de Windows (icono, manifiesto, copyright)
        working-directory: conectar-gateway
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          $(go env GOPATH)/bin/goversioninfo -icon=icono.ico -manifest=app.manifest \
            -o=rsrc_windows_amd64.syso versioninfo.json

      - name: Compilar binarios
        working-directory: conectar-gateway
        run: |
          CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ \
            CGO_CXXFLAGS="-I${PWD}/winhdr" GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -H windowsgui" -o ../Conectar-Gateway.exe .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o ../conectar-gateway-linux .

      - name: Publicar en el Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Conectar-Gateway.exe
            conectar-gateway-linux
