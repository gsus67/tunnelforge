name: qa-repair

on:
  push:
    branches: ['qa/**']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar reparación determinista
        run: python herramientas/qa_fix_monitoring.py
      - name: Verificar sintaxis y registrar cambio
        run: |
          cd conectar-gateway
          gofmt -w monitoring.go
          cd ..
          git diff --check
          if git diff --quiet; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conectar-gateway/monitoring.go
          git commit -m "qa: corregir tags JSON de monitoreo"
          git push
