name: build-release

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: conectar-gateway/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Wails estable
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Preparar dependencias Go
        working-directory: conectar-gateway
        run: |
          go mod download
          go mod tidy

      - name: Preparar motor WireGuard embebido
        shell: pwsh
        run: .\herramientas\preparar-wireguard-windows.ps1 -WorkDir "$env:GITHUB_WORKSPACE\wireguard-upstream"

      - name: Compilar Windows
        working-directory: conectar-gateway
        shell: pwsh
        run: |
          wails build -clean -tags wireguard_embedded -o Conectar-Gateway
          $candidatos = @(
            "build/bin/Conectar-Gateway.exe",
            "build/bin/Conectar-Gateway"
          )
          $binario = $candidatos | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $binario) {
            Write-Error "Wails terminó pero no encontré el binario Windows en build/bin"
            Get-ChildItem "build/bin" -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Copy-Item $binario "../Conectar-Gateway.exe" -Force
          Write-Host "Binario Windows preparado desde: $binario"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: Conectar-Gateway.exe
          if-no-files-found: error

  build-linux:
    name: Linux amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: conectar-gateway/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dependencias Wails Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Instalar Wails estable
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Preparar dependencias Go
        working-directory: conectar-gateway
        run: |
          go mod download
          go mod tidy

      - name: Compilar Linux
        working-directory: conectar-gateway
        run: |
          wails build -clean -tags webkit2_41 -o conectar-gateway-linux
          cp build/bin/conectar-gateway-linux ../conectar-gateway-linux
          chmod +x ../conectar-gateway-linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: conectar-gateway-linux
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Preparar binarios
        run: |
          cp artifacts/Conectar-Gateway.exe ./Conectar-Gateway.exe
          cp artifacts/conectar-gateway-linux ./conectar-gateway-linux
          chmod +x conectar-gateway-linux
          ls -lh Conectar-Gateway.exe conectar-gateway-linux

      - name: Verificar versión del tag
        run: |
          APP_VERSION="$(sed -n 's/^const version = "\([^"]*\)"/\1/p' conectar-gateway/main.go)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test -n "$APP_VERSION" || { echo "No pude leer la versión de main.go"; exit 1; }
          test "$APP_VERSION" = "$TAG_VERSION" || { echo "app=$APP_VERSION pero tag=$TAG_VERSION"; exit 1; }

      - name: Crear y firmar manifest de actualización
        env:
          UPDATE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PEM }}
          EXPECTED_UPDATE_PUBLIC_KEY_B64: 6SpruRdmfhfJk0i0oLMM4onShah2733MFsKMNycOFrk=
        run: |
          test -n "$UPDATE_SIGNING_PRIVATE_KEY_PEM" || { echo "Falta el secret UPDATE_SIGNING_PRIVATE_KEY_PEM"; exit 1; }
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_PRIVATE_KEY_PEM" > /tmp/update-signing-key.pem
          DERIVED="$(openssl pkey -in /tmp/update-signing-key.pem -pubout -outform DER | tail -c 32 | base64 -w0)"
          test "$DERIVED" = "$EXPECTED_UPDATE_PUBLIC_KEY_B64" || { echo "La clave de firma no corresponde a la pública embebida"; exit 1; }
          python3 - <<'PY'
          import hashlib,json,os
          def meta(path):
              data=open(path,'rb').read()
              return {'name':os.path.basename(path),'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)}
          tag=os.environ['GITHUB_REF_NAME']
          manifest={
              'version':tag.removeprefix('v'),
              'tag':tag,
              'assets':{
                  'windows-amd64':meta('Conectar-Gateway.exe'),
                  'linux-amd64':meta('conectar-gateway-linux'),
              },
          }
          with open('update-manifest.json','w',newline='\n') as f:
              json.dump(manifest,f,separators=(',',':'),sort_keys=True)
              f.write('\n')
          PY
          openssl pkeyutl -sign -rawin -inkey /tmp/update-signing-key.pem \
            -in update-manifest.json -out update-manifest.sig
          rm -f /tmp/update-signing-key.pem
          sha256sum Conectar-Gateway.exe conectar-gateway-linux update-manifest.json > SHA256SUMS.txt

      - name: Publicar en el Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          ASSETS=(Conectar-Gateway.exe conectar-gateway-linux update-manifest.json update-manifest.sig SHA256SUMS.txt)

          retry_gh() {
            local attempt=1
            local max_attempts=7
            local delay=5
            local rc=0

            while true; do
              echo "GitHub API intento ${attempt}/${max_attempts}: gh $*" >&2
              if gh "$@"; then
                return 0
              else
                rc=$?
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "GitHub API siguió fallando después de ${max_attempts} intentos." >&2
                return "$rc"
              fi

              echo "Fallo temporal al hablar con GitHub. Reintentando en ${delay}s..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              if [ "$delay" -lt 40 ]; then
                delay=$((delay * 2))
              fi
            done
          }

          # Comprobar el Release mediante REST para distinguir un 404 real de un 5xx.
          # curl --retry vuelve a intentar respuestas HTTP transitorias como 503.
          RELEASE_JSON="$(mktemp)"
          HTTP_CODE="$(curl -sS \
            --retry 7 --retry-delay 5 --retry-max-time 180 \
            --connect-timeout 15 --max-time 60 \
            -o "$RELEASE_JSON" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"

          case "$HTTP_CODE" in
            200)
              echo "El Release $TAG ya existe; continuaré con la subida de assets."
              ;;
            404)
              echo "El Release $TAG no existe; creándolo..."
              retry_gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" --draft
              ;;
            *)
              echo "GitHub devolvió HTTP $HTTP_CODE al consultar el Release:" >&2
              cat "$RELEASE_JSON" >&2 || true
              rm -f "$RELEASE_JSON"
              exit 1
              ;;
          esac
          rm -f "$RELEASE_JSON"

          # Subir uno a uno. Si GitHub falla a mitad de publicación, el rerun puede
          # continuar de forma segura y --clobber reemplaza el asset parcial/existente.
          for asset in "${ASSETS[@]}"; do
            echo "Subiendo $asset..."
            retry_gh release upload "$TAG" "$asset" --clobber
          done

          IS_DRAFT="$(retry_gh release view "$TAG" --json isDraft --jq '.isDraft')"
          if [ "$IS_DRAFT" = "true" ]; then
            retry_gh release edit "$TAG" --draft=false
          fi

          echo "Release $TAG publicado correctamente."
