name: build-release

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: conectar-gateway/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Wails estable
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Preparar dependencias Go
        working-directory: conectar-gateway
        run: |
          go mod download
          go mod tidy

      - name: Compilar Windows
        working-directory: conectar-gateway
        shell: pwsh
        run: |
          wails build -clean -o Conectar-Gateway
          Copy-Item "build/bin/Conectar-Gateway.exe" "../Conectar-Gateway.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: Conectar-Gateway.exe
          if-no-files-found: error

  build-linux:
    name: Linux amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: conectar-gateway/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dependencias Wails Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Instalar Wails estable
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Preparar dependencias Go
        working-directory: conectar-gateway
        run: |
          go mod download
          go mod tidy

      - name: Compilar Linux
        working-directory: conectar-gateway
        run: |
          wails build -clean -tags webkit2_41 -o conectar-gateway-linux
          cp build/bin/conectar-gateway-linux ../conectar-gateway-linux
          chmod +x ../conectar-gateway-linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: conectar-gateway-linux
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Preparar binarios
        run: |
          cp artifacts/Conectar-Gateway.exe ./Conectar-Gateway.exe
          cp artifacts/conectar-gateway-linux ./conectar-gateway-linux
          chmod +x conectar-gateway-linux
          ls -lh Conectar-Gateway.exe conectar-gateway-linux

      - name: Verificar versión del tag
        run: |
          APP_VERSION="$(sed -n 's/^const version = "\([^"]*\)"/\1/p' conectar-gateway/main.go)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test -n "$APP_VERSION" || { echo "No pude leer la versión de main.go"; exit 1; }
          test "$APP_VERSION" = "$TAG_VERSION" || { echo "app=$APP_VERSION pero tag=$TAG_VERSION"; exit 1; }

      - name: Crear y firmar manifest de actualización
        env:
          UPDATE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PEM }}
          EXPECTED_UPDATE_PUBLIC_KEY_B64: 6SpruRdmfhfJk0i0oLMM4onShah2733MFsKMNycOFrk=
        run: |
          test -n "$UPDATE_SIGNING_PRIVATE_KEY_PEM" || { echo "Falta el secret UPDATE_SIGNING_PRIVATE_KEY_PEM"; exit 1; }
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_PRIVATE_KEY_PEM" > /tmp/update-signing-key.pem
          DERIVED="$(openssl pkey -in /tmp/update-signing-key.pem -pubout -outform DER | tail -c 32 | base64 -w0)"
          test "$DERIVED" = "$EXPECTED_UPDATE_PUBLIC_KEY_B64" || { echo "La clave de firma no corresponde a la pública embebida"; exit 1; }
          python3 - <<'PY'
          import hashlib,json,os
          def meta(path):
              data=open(path,'rb').read()
              return {'name':os.path.basename(path),'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)}
          tag=os.environ['GITHUB_REF_NAME']
          manifest={
              'version':tag.removeprefix('v'),
              'tag':tag,
              'assets':{
                  'windows-amd64':meta('Conectar-Gateway.exe'),
                  'linux-amd64':meta('conectar-gateway-linux'),
              },
          }
          with open('update-manifest.json','w',newline='\n') as f:
              json.dump(manifest,f,separators=(',',':'),sort_keys=True)
              f.write('\n')
          PY
          openssl pkeyutl -sign -rawin -inkey /tmp/update-signing-key.pem \
            -in update-manifest.json -out update-manifest.sig
          rm -f /tmp/update-signing-key.pem
          sha256sum Conectar-Gateway.exe conectar-gateway-linux update-manifest.json > SHA256SUMS.txt

      - name: Publicar en el Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          ASSETS=(Conectar-Gateway.exe conectar-gateway-linux update-manifest.json update-manifest.sig SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" = "true" ]; then gh release edit "$TAG" --draft=false; fi
          else
            gh release create "$TAG" "${ASSETS[@]}" --verify-tag --generate-notes --title "$TAG"
          fi
