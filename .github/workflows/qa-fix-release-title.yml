name: qa-fix-release-title

on:
  push:
    branches: ['qa/stable-3.4.7']

permissions:
  contents: write

jobs:
  fix-title:
    runs-on: ubuntu-latest
    steps:
      - name: Corregir título del release v3.4.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v3.4.7 --repo "$GITHUB_REPOSITORY" --title "v3.4.7"
